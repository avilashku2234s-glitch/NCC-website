<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadet Registration - National Cadet Corps (NCC)</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --navy-blue: #0B1F3A;
            --army-red: #C8102E;
            --airforce-blue: #00AEEF;
            --gold-accent: #D4AF37;
            --bg-light: #F8FAFC;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --white: #FFFFFF;
            --error-red: #DC2626;
            --success-green: #16A34A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(11, 31, 58, 0.95), rgba(11, 31, 58, 0.85)),
                        url('https://images.unsplash.com/photo-1579912437766-7896df6d3cd3?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
        }

        /* ================= MAIN REGISTRATION CARD ================= */
        .register-wrapper {
            width: 100%;
            max-width: 860px;
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            animation: cardAppear 0.65s ease forwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= TOP HEADER STRIP ================= */
        .reg-header {
            background: linear-gradient(135deg, var(--navy-blue), #163763);
            padding: 28px 36px;
            color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid var(--army-red);
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--white);
        }

        .ncc-crest {
            width: 46px;
            height: 52px;
            background: linear-gradient(90deg, var(--army-red) 33%, var(--navy-blue) 33% 66%, var(--airforce-blue) 66%);
            border-radius: 6px 6px 26px 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-accent);
            font-weight: 800;
            font-size: 13px;
            border: 2px solid var(--gold-accent);
        }

        .brand-left h1 {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
        }

        .brand-left span {
            font-size: 11px;
            color: var(--gold-accent);
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .back-link {
            color: var(--gold-accent);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }

        .back-link:hover { color: var(--white); }

        /* ================= FORM BODY ================= */
        .reg-body {
            padding: 36px 40px 42px;
        }

        /* Profile Picture Upload Circle */
        .avatar-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
        }

        .avatar-preview {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            border: 4px solid var(--gold-accent);
            background: #E2E8F0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 8px 20px rgba(11, 31, 58, 0.18);
            margin-bottom: 10px;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-preview i {
            font-size: 40px;
            color: var(--text-muted);
        }

        .upload-btn-label {
            background: var(--navy-blue);
            color: var(--white);
            padding: 7px 16px;
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .upload-btn-label:hover {
            background: var(--army-red);
        }

        #profilePic {
            display: none;
        }

        /* Grid Inputs */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy-blue);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.left-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-wrapper input,
        .input-wrapper textarea {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-dark);
            background: #F8FAFC;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper textarea {
            resize: vertical;
            min-height: 82px;
            padding-top: 12px;
        }

        .input-wrapper input:focus,
        .input-wrapper textarea:focus {
            border-color: var(--navy-blue);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(11, 31, 58, 0.08);
        }

        .input-wrapper input.invalid {
            border-color: var(--error-red);
            background: #FEF2F2;
        }

        .input-wrapper input.valid {
            border-color: var(--success-green);
            background: #F0FDF4;
        }

        .warning-msg {
            display: none;
            align-items: center;
            gap: 7px;
            margin-top: 6px;
            padding: 7px 10px;
            border-radius: 7px;
            background: #FEE2E2;
            border-left: 4px solid var(--error-red);
            color: #B91C1C;
            font-size: 12px;
            font-weight: 600;
        }

        .warning-msg.show {
            display: flex;
        }

        /* Submit Button */
        .btn-register {
            width: 100%;
            margin-top: 26px;
            padding: 14px;
            background: linear-gradient(135deg, var(--army-red), #A30B23);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 24px rgba(200, 16, 46, 0.3);
        }

        .btn-register:hover {
            background: linear-gradient(135deg, var(--navy-blue), #163763);
            transform: translateY(-2px);
        }

        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-redirect {
            text-align: center;
            margin-top: 20px;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .login-redirect a {
            color: var(--navy-blue);
            font-weight: 700;
            text-decoration: none;
        }

        .login-redirect a:hover {
            color: var(--army-red);
            text-decoration: underline;
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 720px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .reg-header { flex-direction: column; gap: 12px; text-align: center; }
            .reg-body { padding: 28px 22px; }
        }
    </style>
</head>
<body>

    <div class="register-wrapper">
        <!-- HEADER -->
        <div class="reg-header">
            <a href="index.html" class="brand-left">
                <div class="ncc-crest">NCC</div>
                <div>
                    <h1>New Cadet Registration</h1>
                    <span>UNITY AND DISCIPLINE</span>
                </div>
            </a>
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-house"></i> Home
            </a>
        </div>

        <!-- FORM BODY -->
        <div class="reg-body">
            <form id="registerForm" novalidate>
                <!-- PROFILE PICTURE UPLOAD -->
                <div class="avatar-upload">
                    <div class="avatar-preview">
                        <i class="fa-solid fa-user" id="defaultIcon"></i>
                        <img id="previewImg" src="" alt="Profile Preview">
                    </div>
                    <label for="profilePic" class="upload-btn-label">
                        <i class="fa-solid fa-camera"></i> Upload Profile Picture
                    </label>
                    <input type="file" id="profilePic" accept="image/*">
                </div>

                <div class="form-grid">
                    <!-- FULL NAME -->
                    <div class="input-group">
                        <label for="fullName">Cadet Full Name *</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user left-icon"></i>
                            <input type="text" id="fullName" placeholder="e.g., Rohit Kumar" required>
                        </div>
                    </div>

                    <!-- PHONE NUMBER -->
                    <div class="input-group">
                        <label for="phone">Phone Number *</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-phone left-icon"></i>
                            <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" required>
                        </div>
                    </div>

                    <!-- EMAIL (STRICT LOWERCASE) -->
                    <div class="input-group">
                        <label for="email">Email Address *</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-envelope left-icon"></i>
                            <input type="text" id="email" placeholder="example@gmail.com" autocomplete="off" required>
                        </div>
                        <div class="warning-msg" id="emailWarning">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span>Your email is incorrect, please check your email.</span>
                        </div>
                    </div>

                    <!-- REGIMENTAL NUMBER -->
                    <div class="input-group">
                        <label for="regNo">Regimental Number *</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-id-badge left-icon"></i>
                            <input type="text" id="regNo" placeholder="e.g., JH26SDA104521" required>
                        </div>
                    </div>

                    <!-- NEW PASSWORD -->
                    <div class="input-group">
                        <label for="newPassword">New Password *</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock left-icon"></i>
                            <input type="password" id="newPassword" placeholder="Minimum 6 characters" required>
                        </div>
                    </div>

                    <!-- CONFIRM PASSWORD -->
                    <div class="input-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-shield-halved left-icon"></i>
                            <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                        </div>
                        <div class="warning-msg" id="passWarning">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span>Passwords do not match!</span>
                        </div>
                    </div>

                    <!-- FULL ADDRESS -->
                    <div class="input-group full-width">
                        <label for="address">Full Address *</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-location-dot left-icon" style="top: 15px;"></i>
                            <textarea id="address" placeholder="House No, Street, City, State, PIN Code" required></textarea>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-register" id="submitBtn">
                    Complete Registration
                </button>
            </form>

            <p class="login-redirect">
                Already registered? <a href="login.html">Login here</a>
            </p>
        </div>
    </div>

    <!-- FIREBASE INTEGRATION SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ==========================================================
        // STEP 1: YAHAN APNA FIREBASE CONFIG PASTE KAREIN
        // (Firebase Console -> Project Settings -> Your Apps -> Config)
        // ==========================================================
        const firebaseConfig = {
  apiKey: "AIzaSyC84XqN0Z6pk7QDFPimIXFJOSAIVAVqM1w",
  authDomain: "courses-d6f51.firebaseapp.com",
  projectId: "courses-d6f51",
  storageBucket: "courses-d6f51.firebasestorage.app",
  messagingSenderId: "174296262594",
  appId: "1:174296262594:web:375fbf8ef982316472585b",
  measurementId: "G-EDPL34HH4G"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Elements
        const profilePicInput = document.getElementById('profilePic');
        const previewImg = document.getElementById('previewImg');
        const defaultIcon = document.getElementById('defaultIcon');
        const emailInput = document.getElementById('email');
        const emailWarning = document.getElementById('emailWarning');
        const newPassInput = document.getElementById('newPassword');
        const confirmPassInput = document.getElementById('confirmPassword');
        const passWarning = document.getElementById('passWarning');
        const submitBtn = document.getElementById('submitBtn');
        const registerForm = document.getElementById('registerForm');

        let compressedProfilePic = ""; // Base64 image string for Firestore (100% Free Plan friendly)

        // Profile Picture Preview & Compression
        profilePicInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Resize image to 200x200 so it saves fast in Firestore
                    const canvas = document.createElement('canvas');
                    const maxSize = 200;
                    canvas.width = maxSize;
                    canvas.height = maxSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, maxSize, maxSize);
                    compressedProfilePic = canvas.toDataURL('image/jpeg', 0.75);

                    previewImg.src = compressedProfilePic;
                    previewImg.style.display = 'block';
                    defaultIcon.style.display = 'none';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Strict Lowercase Email Validation (Same as login.html)
        const strictLowercaseEmailRegex = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;
        const hasUppercaseRegex = /[A-Z]/;

        function validateEmail() {
            const val = emailInput.value;
            if (val.length === 0) {
                emailInput.classList.remove('invalid', 'valid');
                emailWarning.classList.remove('show');
                return false;
            }
            if (hasUppercaseRegex.test(val) || !strictLowercaseEmailRegex.test(val)) {
                emailInput.classList.add('invalid');
                emailInput.classList.remove('valid');
                emailWarning.classList.add('show');
                return false;
            } else {
                emailInput.classList.remove('invalid');
                emailInput.classList.add('valid');
                emailWarning.classList.remove('show');
                return true;
            }
        }

        emailInput.addEventListener('input', validateEmail);

        // Password Match Check
        confirmPassInput.addEventListener('input', () => {
            if (confirmPassInput.value !== newPassInput.value) {
                confirmPassInput.classList.add('invalid');
                passWarning.classList.add('show');
            } else {
                confirmPassInput.classList.remove('invalid');
                passWarning.classList.remove('show');
            }
        });

        // Registration Form Submit
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = emailInput.value.trim();
            const regNo = document.getElementById('regNo').value.trim();
            const password = newPassInput.value;
            const confirmPass = confirmPassInput.value;
            const address = document.getElementById('address').value.trim();

            if (!fullName || !phone || !regNo || !address) {
                alert("Please fill all required fields.");
                return;
            }

            if (!validateEmail()) {
                emailInput.focus();
                return;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters long.");
                return;
            }

            if (password !== confirmPass) {
                passWarning.classList.add('show');
                confirmPassInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Saving to Firebase...";

            try {
                // 1. Firebase Auth mein user create karein
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Firestore Database ('cadets' collection) mein poori details save karein
                await setDoc(doc(db, "cadets", user.uid), {
                    uid: user.uid,
                    fullName: fullName,
                    phone: phone,
                    email: email,
                    regimentalNumber: regNo,
                    address: address,
                    profilePicture: compressedProfilePic || "",
                    createdAt: new Date().toISOString()
                });

                // 3. Auto-login band karein taaki user login.html par jaakar khud login kare
                await signOut(auth);

                alert("Registration Successful! Ab apne Email aur Password se Login karein.");
                
                // 4. Direct Login Page par redirect
                window.location.href = "login.html";

            } catch (error) {
                alert("Registration Failed: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Complete Registration";
            }
        });
    </script>
</body>
</html>
